{% extends 'base.html' %}{% block title %}Apply: {{job.title}}{% endblock %}{% block content %}<section class="page-hero"><p class="eyebrow">Career application</p><h1>{{job.title}}</h1><p>{{job.department}} · {{job.location}} · {{job.employment_type}}</p></section><section class="page-body"><div class="richtext"><h2>Role overview</h2><p>{{job.description}}</p><h3>Requirements</h3><p>{{job.requirements}}</p></div><form class="contact-form" method="post" enctype="multipart/form-data"><input name="name" placeholder="Full name *" required><input type="email" name="email" placeholder="Email *" required><input name="phone" placeholder="Phone *" required><input name="experience" placeholder="Experience"><textarea name="message" placeholder="Tell us about yourself"></textarea><label>Resume (PDF/DOC/DOCX)<input type="file" name="resume" accept=".pdf,.doc,.docx"></label><button class="btn primary">Submit application</button></form></section>{% endblock %}
