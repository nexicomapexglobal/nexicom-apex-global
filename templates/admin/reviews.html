{% extends 'admin/base.html' %}{% block content %}<div class="top"><div><p>Testimonials and ratings</p><h1>Reviews</h1></div></div><div class="admin-columns"><form class="panel admin-form" method="post" enctype="multipart/form-data"><h2>{{'Edit' if edit_item else 'Add'}} review</h2><input type="hidden" name="id" value="{{edit_item.id if edit_item else ''}}"><label>Client name<input name="client_name" value="{{edit_item.client_name if edit_item else ''}}" required></label><label>Company<input name="company" value="{{edit_item.company if edit_item else ''}}"></label><label>Service used<input name="service_used" value="{{edit_item.service_used if edit_item else ''}}"></label><label>Rating<input type="number" min="1" max="5" name="rating" value="{{edit_item.rating if edit_item else 5}}"></label><label>Review<textarea name="review_text" required>{{edit_item.review_text if edit_item else ''}}</textarea></label><label>Photo/logo<input type="file" name="photo"></label><label>Order<input type="number" name="sort_order" value="{{edit_item.sort_order if edit_item else 0}}"></label><label><input type="checkbox" name="is_featured" {% if edit_item and edit_item.is_featured %}checked{% endif %}> Featured</label><label><input type="checkbox" name="is_active" {% if not edit_item or edit_item.is_active %}checked{% endif %}> Active</label><button class="button">Save review</button></form><section class="panel"><h2>All reviews</h2>{% for x in items %}<div class="item-row"><div><b>{{x.client_name}} — {{'★'*x.rating}}</b><small>{{x.company}}</small></div><div><a href="?edit={{x.id}}">Edit</a><form method="post" action="/admin/delete/review/{{x.id}}"><button class="danger">Delete</button></form></div></div>{% endfor %}</section></div>{% endblock %}
