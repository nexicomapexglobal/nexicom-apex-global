{% extends 'admin/base.html' %}{% block content %}<div class="top"><div><p>Cards and animated profile popups</p><h1>Team Management</h1></div></div><div class="admin-columns"><form class="panel admin-form" method="post" enctype="multipart/form-data"><h2>{{'Edit' if edit_item else 'Add'}} team member</h2><input type="hidden" name="id" value="{{edit_item.id if edit_item else ''}}"><label>Name<input name="name" value="{{edit_item.name if edit_item else ''}}" required></label><label>Role<input name="role" value="{{edit_item.role if edit_item else ''}}" required></label><label>Department<input name="department" value="{{edit_item.department if edit_item else ''}}"></label><label>Short bio<textarea name="short_bio">{{edit_item.short_bio if edit_item else ''}}</textarea></label><label>Full popup biography<textarea name="bio">{{edit_item.bio if edit_item else ''}}</textarea></label><label>Experience<input name="experience" value="{{edit_item.experience if edit_item else ''}}"></label><label>Skills<textarea name="skills">{{edit_item.skills if edit_item else ''}}</textarea></label><label>Achievements<textarea name="achievements">{{edit_item.achievements if edit_item else ''}}</textarea></label><label>Email<input name="email" value="{{edit_item.email if edit_item else ''}}"></label><label>LinkedIn<input name="linkedin" value="{{edit_item.linkedin if edit_item else ''}}"></label><label>Photo<input type="file" name="photo"></label><label>Order<input type="number" name="sort_order" value="{{edit_item.sort_order if edit_item else 0}}"></label><label><input type="checkbox" name="is_featured" {% if edit_item and edit_item.is_featured %}checked{% endif %}> Featured</label><label><input type="checkbox" name="is_active" {% if not edit_item or edit_item.is_active %}checked{% endif %}> Active</label><button class="button">Save member</button></form><section class="panel"><h2>All team members</h2>{% for x in items %}<div class="item-row"><div><b>{{x.name}}</b><small>{{x.role}}</small></div><div><a href="?edit={{x.id}}">Edit</a><form method="post" action="/admin/delete/team/{{x.id}}"><button class="danger">Delete</button></form></div></div>{% else %}<p>No team members yet.</p>{% endfor %}</section></div>{% endblock %}
