{% extends 'admin/base.html' %}{% block content %}<div class="top"><div><p>Lead inbox</p><h1>Contact Enquiries</h1></div></div><section class="panel table-scroll"><table><tr><th>Name</th><th>Contact</th><th>Subject</th><th>Message</th><th>Date</th></tr>{% for x in messages %}<tr><td>{{x.name}}</td><td>{{x.email}}<br>{{x.phone}}</td><td>{{x.subject}}</td><td>{{x.message}}</td><td>{{x.created_at.strftime('%d %b %Y')}}</td></tr>{% else %}<tr><td colspan="5">No enquiries yet.</td></tr>{% endfor %}</table></section>{% endblock %}
