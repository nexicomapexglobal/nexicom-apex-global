{% extends 'admin/base.html' %}{% block content %}<div class="top"><div><p>Career opportunities</p><h1>Job Openings</h1></div></div><div class="admin-columns"><form class="panel admin-form" method="post"><h2>{{'Edit' if edit_item else 'Add'}} job</h2><input type="hidden" name="id" value="{{edit_item.id if edit_item else ''}}"><label>Job title<input name="title" value="{{edit_item.title if edit_item else ''}}" required></label><label>Department<input name="department" value="{{edit_item.department if edit_item else ''}}"></label><label>Location<input name="location" value="{{edit_item.location if edit_item else 'Bangalore'}}"></label><label>Employment type<input name="employment_type" value="{{edit_item.employment_type if edit_item else 'Full-time'}}"></label><label>Experience<input name="experience" value="{{edit_item.experience if edit_item else ''}}"></label><label>Salary<input name="salary" value="{{edit_item.salary if edit_item else ''}}"></label><label>Description<textarea name="description">{{edit_item.description if edit_item else ''}}</textarea></label><label>Requirements<textarea name="requirements">{{edit_item.requirements if edit_item else ''}}</textarea></label><label><input type="checkbox" name="is_active" {% if not edit_item or edit_item.is_active %}checked{% endif %}> Active</label><button class="button">Publish job</button></form><section class="panel"><h2>All jobs</h2>{% for x in items %}<div class="item-row"><div><b>{{x.title}}</b><small>{{x.location}} · {{x.employment_type}}</small></div><div><a href="?edit={{x.id}}">Edit</a><form method="post" action="/admin/delete/job/{{x.id}}"><button class="danger">Delete</button></form></div></div>{% else %}<p>No jobs yet.</p>{% endfor %}</section></div>{% endblock %}
