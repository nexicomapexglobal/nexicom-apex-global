{% extends 'admin/base.html' %}{% block content %}<div class="top"><div><p>Website content</p><h1>Services</h1></div></div><div class="admin-columns"><form class="panel admin-form" method="post" enctype="multipart/form-data"><h2>{{'Edit' if edit_item else 'Add'}} service</h2><input type="hidden" name="id" value="{{edit_item.id if edit_item else ''}}"><label>Title<input name="title" value="{{edit_item.title if edit_item else ''}}" required></label><label>URL slug<input name="slug" value="{{edit_item.slug if edit_item else ''}}"></label><label>Icon<input name="icon" value="{{edit_item.icon if edit_item else '✦'}}"></label><label>Short description<textarea name="short_description">{{edit_item.short_description if edit_item else ''}}</textarea></label><label>Full description<textarea name="description">{{edit_item.description if edit_item else ''}}</textarea></label><label>Image<input type="file" name="image"></label><label>Display order<input type="number" name="sort_order" value="{{edit_item.sort_order if edit_item else 0}}"></label><label><input type="checkbox" name="is_active" {% if not edit_item or edit_item.is_active %}checked{% endif %}> Active</label><button class="button">Save service</button></form><section class="panel"><h2>All services</h2>{% for x in items %}<div class="item-row"><div><b>{{x.title}}</b><small>{{x.short_description}}</small></div><div><a href="?edit={{x.id}}">Edit</a><form method="post" action="/admin/delete/service/{{x.id}}"><button class="danger">Delete</button></form></div></div>{% endfor %}</section></div>{% endblock %}
